# rsync_project 同步配置文件
# 生成时间: 2026-02-02 14:49:50

# 远程服务器配置
remote:
  host: "192.168.1.42"        # 远程服务器地址
  user: "ubuntu"              # SSH 用户名
  path: "/home/ubuntu/Projects/fpa_fire_detection"  # 远程目录路径
  port: 22                    # SSH 端口

# 是否使用 .gitignore 中的排除规则（默认 true）
use_gitignore: true

# 额外的排除规则（会与 .gitignore 合并）
# 支持 rsync 的排除模式
exclude:
  - "sync_config.yaml"     # 不同步配置文件本身
  - "*.log"                # 日志文件
  - "*.tmp"                # 临时文件
  - ".DS_Store"            # macOS 系统文件
  - "Thumbs.db"            # Windows 系统文件
  # - "*.o"                # C/C++ 编译中间文件
  # - "*.exe"              # 可执行文件
  # - "build/"             # 构建目录
  # - "dist/"              # 发布目录
  # - "node_modules/"      # Node.js 依赖
  # - "__pycache__/"       # Python 缓存
  # - ".venv/"             # Python 虚拟环境

# rsync 额外选项（可选）
# rsync_options: "-avz --progress"
